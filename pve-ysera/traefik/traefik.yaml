entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  # Clone Git en SSH vers Forgejo (VM 300). Un entryPoint dédié plutôt qu'un
  # routage sur le nom : SSH n'émet pas de SNI, il n'y a donc rien à router
  # sur le nom d'hôte — c'est le port qui sélectionne, et lui seul.
  # Voir dynamic/forgejo.yaml.
  ssh:
    address: ":2222"

api:
  dashboard: true

providers:
  file:
    directory: /etc/traefik-git/dynamic
    watch: true
certificatesResolvers:
  cloudflare:
    acme:
      email: jeanbaptiste.wittner@outlook.com
      storage: /etc/traefik/acme/acme.json
      # Décommente le staging pour tester d'abord (voir §5)
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
log:
  level: INFO
accessLog: {}
