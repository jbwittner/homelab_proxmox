http:
  routers:
    forgejo:
      # Nom PUBLIC : cette instance est exposée hors du LAN, contrairement au
      # reste du parc qui vit sous *.lan.wittner.tech. Le certificat est couvert
      # par le store par défaut de ../dynamic/tls.yaml, qui porte déjà
      # « *.wittner.tech ».
      rule: "Host(`forgejo.wittner.tech`)"
      entryPoints:
        - websecure
      service: forgejo
      tls: {}

  services:
    forgejo:
      loadBalancer:
        # La VM 300 sert en HTTP simple sur son IP : le LAN entre Traefik et
        # la machine n'a pas de secret à protéger, et un certificat
        # auto-signé de plus serait un certificat de plus à faire vivre.
        servers:
          - url: "http://192.168.1.56:3000"
        # OBLIGATOIRE. Forgejo construit ses URL de redirection à partir de
        # l'en-tête Host ; sans lui, une connexion réussie renvoie vers
        # « http://192.168.1.56:3000/ » et le navigateur sort du TLS.
        passHostHeader: true

# ─── SSH ─────────────────────────────────────────────────────────────────────
#
# Le clone SSH passe par un routeur TCP sur un entryPoint dédié (2222, déclaré
# dans ../traefik.yaml). Deux conséquences voulues :
#
#   - UN SEUL NOM D'HÔTE pour les deux protocoles. Les URL de clone que Forgejo
#     affiche (ssh://git@forgejo.wittner.tech:2222/…) sont alors justes
#     sans entrée DNS supplémentaire, et ne portent pas d'IP — donc elles
#     survivent à un changement d'adresse de la machine.
#   - LE PORT 22 DE LA VM RESTE À L'ADMINISTRATION. C'est le serveur SSH
#     INTERNE de Forgejo (Go) qui écoute, dans le conteneur, sur le 22 que la
#     VM publie en 2222 ; les clés publiques des utilisateurs restent gérées
#     par Forgejo seul et ne touchent jamais l'authorized_keys du compte
#     d'administration.
#
# Ce chemin dépend de Traefik, comme le HTTPS : il n'ajoute donc AUCUNE
# dépendance nouvelle à la source de vérité. Si Traefik est absent, le clone
# reste possible en visant directement la VM — voir forgejo/doc/PRA.md.
tcp:
  routers:
    forgejo-ssh:
      # HostSNI(`*`) : SSH n'émet pas de SNI, il n'y a donc rien à router sur
      # le nom. C'est l'entryPoint qui fait la sélection, et lui seul.
      rule: "HostSNI(`*`)"
      entryPoints:
        - ssh
      service: forgejo-ssh

  services:
    forgejo-ssh:
      loadBalancer:
        servers:
          - address: "192.168.1.56:2222"
