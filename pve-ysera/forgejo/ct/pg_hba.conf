# pg_hba.conf — cluster co-localisé du CT 400 (Forgejo).
#
# Lecture de haut en bas, PREMIÈRE correspondance gagnante. L'ordre des lignes
# est donc significatif.
#
# CE FICHIER NE CONTIENT AUCUNE LIGNE « host ». Ce n'est pas une omission :
# `listen_addresses = ''` fait que PostgreSQL n'ouvre aucun socket TCP, donc
# une règle host ne pourrait jamais s'appliquer. En écrire une donnerait
# l'illusion qu'un accès réseau existe et qu'il est encadré ici — alors qu'il
# n'existe pas du tout. La ligne `reject` finale est conservée pour la même
# raison inverse : elle rend l'intention lisible si quelqu'un rouvre un jour
# `listen_addresses`.
#
# TYPE    DATABASE    USER        ADDRESS           METHOD

# ─── Administration locale ───────────────────────────────────────────────────
# La porte de secours. Posée par l'initdb du paquet (--auth-local peer) : tant
# que cette ligne existe, aucun mot de passe perdu ne t'enferme dehors.
# Ne jamais supprimer.
local     all         postgres                      peer

# ─── Forgejo ─────────────────────────────────────────────────────────────────
# Forgejo tourne sous l'utilisateur système « git » et doit se connecter au
# rôle SQL « forgejo ». Sans `map=`, peer exigerait que les deux noms soient
# identiques et refuserait la connexion avec :
#
#     FATAL:  Peer authentication failed for user "forgejo"
#
# C'est l'échec le plus probable d'un premier démarrage, et il ne ressemble
# pas à sa cause. La correspondance est déclarée dans pg_ident.conf.
local     forgejo     forgejo                       peer  map=forgejo

# ─── Le reste des accès locaux ───────────────────────────────────────────────
# Après les deux règles ci-dessus, donc sans effet sur elles. Permet à un
# administrateur entré en `pct exec` de se connecter sous son propre compte.
local     all         all                           peer

# ─── Refus explicite ─────────────────────────────────────────────────────────
# Inatteignable tant que `listen_addresses` est vide. Volontairement gardée :
# le jour où quelqu'un rouvre le TCP « juste pour un test », c'est cette ligne
# qui fait que le test échoue au lieu de réussir.
host      all         all         0.0.0.0/0         reject
