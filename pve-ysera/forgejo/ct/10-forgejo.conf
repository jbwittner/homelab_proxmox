# conf.d/10-forgejo.conf — cluster PostgreSQL CO-LOCALISÉ du CT 400.
#
# Chargé par l'`include_dir = 'conf.d'` de Debian. On ne touche JAMAIS à
# postgresql.conf : il reste tel que livré par le paquet, et tout ce qui est
# à nous vit ici, versionné dans git.
#
# CE CLUSTER N'EST PAS CELUI DU CT 200. Il ne sert qu'un locataire — Forgejo —
# et il est co-localisé exprès : mutualiser ferait dépendre la réconciliation
# GitOps d'un nœud qui n'héberge même pas Forgejo. Voir doc/RUNBOOK.md
# section 3, « pourquoi PostgreSQL est dans ce conteneur ».
#
# Dimensionné pour un CT à 2 Go de RAM / 2 vCPU servant UNE base. Si tu
# changes la RAM du CT, ajuste shared_buffers et effective_cache_size.

# ─── Réseau : AUCUN ──────────────────────────────────────────────────────────
# Chaîne VIDE, et c'est la décision de sécurité la plus forte de ce fichier :
# PostgreSQL n'ouvre alors AUCUN socket TCP, ni sur le LAN ni sur la boucle
# locale. Le seul chemin d'entrée est la socket Unix /var/run/postgresql, que
# seuls les processus de ce conteneur peuvent atteindre.
#
# Effet de bord heureux : le piège documenté pour le CT 200 — « listen_addresses
# doit valoir '*' et non une IP explicite en LXC, sinon PostgreSQL peut démarrer
# avant que eth0 ne porte l'adresse et se déclarer actif sans écouter » — ne
# peut pas se produire ici. On n'écoute nulle part, donc il n'y a pas de course.
#
# Le contrôle « fj deploy » relit `ss -lntp` et lève une alarme si un socket
# TCP apparaît : ce réglage est trop précieux pour n'être vérifié qu'à l'œil.
listen_addresses = ''

max_connections = 50
superuser_reserved_connections = 3

# ssl = off assumé : il n'y a pas de connexion TCP à chiffrer. Activer SSL sur
# une socket Unix n'apporte rien et fait croire à une protection réseau.
ssl = off

# ─── Mémoire ─────────────────────────────────────────────────────────────────
shared_buffers = 512MB                  # ~25 % des 2 Go du CT
effective_cache_size = 1536MB           # ~75 %, simple indication au planner
work_mem = 8MB                          # par nœud de tri, × connexions !
maintenance_work_mem = 128MB
huge_pages = off                        # indisponible en LXC non privilégié
jit = off                               # inutile en OLTP, latences erratiques

# ─── WAL et checkpoints ──────────────────────────────────────────────────────
wal_compression = zstd
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# ─── Stockage SSD ────────────────────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200

# ─── Parallélisme ────────────────────────────────────────────────────────────
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# ─── Journalisation ──────────────────────────────────────────────────────────
log_min_duration_statement = 1000       # trace toute requête > 1 s
log_checkpoints = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# ─── Autovacuum ──────────────────────────────────────────────────────────────
# Plus agressif que le défaut : le schéma de Forgejo fait beaucoup d'UPDATE
# sur de petites tables très consultées (sessions, notifications, actions).
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ─── Divers ──────────────────────────────────────────────────────────────────
# Conservé bien qu'aucun mot de passe ne serve : le jour où un rôle en reçoit
# un, il ne doit pas être haché en md5 parce que ce réglage manquait.
password_encryption = scram-sha-256
timezone = 'Europe/Paris'
log_timezone = 'Europe/Paris'
