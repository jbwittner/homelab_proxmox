# /etc/postgresql/18/main/pg_hba.conf
#
# Lecture de haut en bas, PREMIÈRE correspondance gagnante. L'ordre des lignes
# est donc significatif : les locataires avant les règles générales, et le
# reject en dernier.
#
# Pas de règle IPv6 : le CT est configuré sans IPv6.
#
# TYPE    DATABASE    USER          ADDRESS                 METHOD

# ─── Administration locale (socket Unix) ─────────────────────────────────────
# Posé par l'initdb du paquet (--auth-local peer). C'est la porte de secours :
# tant que cette ligne existe, aucun mot de passe perdu ne t'enferme dehors.
# Ne jamais supprimer.
local     all         postgres                              peer
local     all         all                                   peer

# ─── Boucle locale ───────────────────────────────────────────────────────────
host      all         all           127.0.0.1/32            scram-sha-256

# ─── Accès interactif (DBeaver depuis le Mac) ────────────────────────────────
# Via tunnel SSH : PostgreSQL voit la connexion arriver de pve-eranikus,
# pas du Mac. En direct depuis le LAN, remplacer par l'IP fixe du poste.
hostssl   all         jbwittner     192.168.1.11/32         scram-sha-256

# ─── Locataires ──────────────────────────────────────────────────────────────
# Un couple base+rôle par service, restreint à l'IP du CT en /32.
# Ajouter une ligne par nouveau service.
hostssl   forgejo     forgejo       192.168.1.57/32         scram-sha-256

# ─── Refus explicite ─────────────────────────────────────────────────────────
# Le refus est déjà le comportement par défaut ; cette ligne rend l'intention
# lisible et journalise proprement les tentatives.
host      all         all           0.0.0.0/0               reject
