# /etc/postgresql/18/main/conf.d/10-homelab.conf
#
# Drop-in chargé par l'`include_dir = 'conf.d'` de Debian. On ne touche JAMAIS
# à postgresql.conf : il reste tel que livré par le paquet, et tout ce qui est
# à nous vit ici, versionné dans git.
#
# Dimensionné pour un CT à 4 Go de RAM / 2 vCPU servant plusieurs locataires.
# Si tu changes la RAM du CT, ajuste shared_buffers et effective_cache_size.

# ─── Réseau ──────────────────────────────────────────────────────────────────
# Surtout pas '*' : on n'écoute que sur l'IP du CT et la boucle locale.
listen_addresses = '192.168.1.56, 127.0.0.1'
port = 5432

max_connections = 100
superuser_reserved_connections = 3

# Debian active déjà ssl=on avec le certificat snakeoil. On le garde : le
# trafic traverse le LAN. Côté client, SSL_MODE = require (pas verify-full,
# le certificat est auto-signé).
ssl = on

# ─── Mémoire ─────────────────────────────────────────────────────────────────
shared_buffers = 1GB                    # ~25 % de la RAM du CT
effective_cache_size = 3GB              # ~75 %, simple indication au planner
work_mem = 8MB                          # par nœud de tri, × connexions !
maintenance_work_mem = 256MB
huge_pages = off                        # indisponible en LXC non privilégié
jit = off                               # postgresql-18-jit est installé ; inutile
                                        # en OLTP, il ajoute des latences erratiques

# ─── WAL et checkpoints ──────────────────────────────────────────────────────
wal_compression = zstd
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# ─── Stockage NVMe ───────────────────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200

# ─── Parallélisme ────────────────────────────────────────────────────────────
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ─── Journalisation ──────────────────────────────────────────────────────────
# Debian redirige déjà stderr vers /var/log/postgresql/ via logging_collector.
log_min_duration_statement = 1000       # trace toute requête > 1 s
log_checkpoints = on
log_connections = 'authentication'      # liste depuis PG 18, plus un booléen
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# ─── Autovacuum ──────────────────────────────────────────────────────────────
# Plus agressif que le défaut : les schémas applicatifs type Forgejo font
# beaucoup de UPDATE sur de petites tables très consultées.
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ─── Divers ──────────────────────────────────────────────────────────────────
password_encryption = scram-sha-256
timezone = 'Europe/Paris'
log_timezone = 'Europe/Paris'
