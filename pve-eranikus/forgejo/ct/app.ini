; app.ini — Forgejo, instance « source de vérité » d'ArgoCD.
;
; ┌────────────────────────────────────────────────────────────────────────┐
; │ Vit dans le dépôt, monté en LECTURE SEULE sur /etc/forgejo-git.         │
; │ Le conteneur en fait une COPIE vers /etc/forgejo/app.ini (root:git,     │
; │ 0640) — voir doc/RUNBOOK.md section 5.                                  │
; └────────────────────────────────────────────────────────────────────────┘
;
; AUCUN SECRET ICI. SECRET_KEY et INTERNAL_TOKEN sont pré-générés, rangés
; dans OpenBao, et déposés dans /etc/forgejo/secrets/ — que ce fichier
; désigne par URI. Ils ne sont JAMAIS produits par l'assistant web, qui est
; désarmé (INSTALL_LOCK), ni écrits ici.
;
; POURQUOI UNE COPIE ET NON UN SYMLINK — Forgejo réécrit app.ini de lui-même
; s'il lui manque un secret qu'il sait générer. Sur un fichier lié à un
; montage en lecture seule, cette écriture échoue et le démarrage part en
; vrille sans que la cause soit lisible. La copie ne change rien au problème
; de fond ; ce qui le règle, c'est que TOUS les secrets sont pré-déposés —
; d'où les quatre lignes *_URI de [server], [security] et [oauth2]. Un
; contrôle du déploiement relit le journal et le dit si l'un manquait.

APP_NAME = Forgejo
RUN_USER = git
RUN_MODE = prod
WORK_PATH = /var/lib/forgejo

[server]
PROTOCOL  = http
; Écoute sur toutes les interfaces du CT : Traefik l'atteint par l'IP du
; conteneur. Le conteneur n'est pas exposé hors du LAN.
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000

DOMAIN     = forgejo.lan.wittner.tech
ROOT_URL   = https://forgejo.lan.wittner.tech/
; Le SSH passe par le routeur TCP de Traefik (entryPoint « ssh », 2222) :
; un seul nom d'hôte pour les deux protocoles, donc une seule entrée DNS et
; des URL de clone qui ne dépendent pas d'une IP.
SSH_DOMAIN = forgejo.lan.wittner.tech
SSH_PORT   = 2222

; Serveur SSH INTERNE (Go), et non le sshd du conteneur. Deux raisons : les
; clés publiques restent gérées par Forgejo seul — rien n'écrit dans un
; authorized_keys partagé avec l'administration — et le sshd du CT garde le
; port 22 pour l'accès humain.
START_SSH_SERVER = true
SSH_LISTEN_HOST  = 0.0.0.0
SSH_LISTEN_PORT  = 2222

APP_DATA_PATH      = /var/lib/forgejo/data
LFS_START_SERVER   = true
LFS_JWT_SECRET_URI = file:/etc/forgejo/secrets/lfs_jwt_secret

; Aucune ressource distante (avatars Gravatar, contrôle de version en ligne).
; Une source de vérité ne doit rien attendre d'internet pour s'afficher.
OFFLINE_MODE = true

[database]
DB_TYPE = postgres
; Socket Unix + peer : pas de TCP, donc pas de mot de passe à faire vivre,
; et le piège « PostgreSQL doit binder '*' et non une IP en LXC » ne se pose
; même pas — voir doc/RUNBOOK.md section 3.
HOST    = /var/run/postgresql
NAME    = forgejo
USER    = forgejo
SCHEMA  = public
LOG_SQL = false

[repository]
ROOT           = /var/lib/forgejo/repositories
DEFAULT_BRANCH = main
; Une source de vérité ne sert pas de dépôt public : rien n'est créé en
; « public » par défaut, et un dépôt créé par push l'est en privé.
DEFAULT_PRIVATE             = private
DEFAULT_PUSH_CREATE_PRIVATE = true

[security]
; L'assistant d'installation web est DÉSARMÉ dès le premier démarrage : il
; est le chemin par lequel une instance neuve se fait configurer par le
; premier venu, et il réécrirait app.ini.
INSTALL_LOCK = true

; Pré-générés, rangés dans OpenBao, déposés par le provisionnement. Jamais
; produits par Forgejo, jamais commités — voir doc/RUNBOOK.md section 7.
SECRET_KEY_URI     = file:/etc/forgejo/secrets/secret_key
INTERNAL_TOKEN_URI = file:/etc/forgejo/secrets/internal_token

; L'IP de Traefik, et elle seule. Jamais « * » : avec un joker, n'importe
; quel client du LAN peut se déclarer n'importe quelle adresse par un
; en-tête X-Forwarded-For, et les journaux comme les limitations par IP
; perdent tout sens.
REVERSE_PROXY_TRUSTED_PROXIES = 192.168.1.50

[oauth2]
JWT_SECRET_URI = file:/etc/forgejo/secrets/oauth2_jwt_secret

[service]
; Personne ne s'inscrit. Les comptes sont créés à la main par un
; administrateur — voir « fj admin » dans le README.
DISABLE_REGISTRATION              = true
REQUIRE_SIGNIN_VIEW               = true
REGISTER_EMAIL_CONFIRM            = false
ENABLE_NOTIFY_MAIL                = false
DEFAULT_KEEP_EMAIL_PRIVATE        = true
DEFAULT_ALLOW_CREATE_ORGANIZATION = true
ENABLE_TIMETRACKING               = false

[migrations]
; Une migration est une requête sortante déclenchée par un utilisateur : sans
; ce verrou, elle peut viser 127.0.0.1 ou le réseau d'administration et faire
; de Forgejo un relais vers ce que lui seul peut joindre.
ALLOW_LOCALNETWORKS = false

[openid]
ENABLE_OPENID_SIGNIN = false
ENABLE_OPENID_SIGNUP = false

[session]
PROVIDER      = file
COOKIE_SECURE = true

[log]
; La console part dans journalctl -u forgejo : un seul endroit où regarder,
; et la rotation est celle de journald.
MODE  = console
LEVEL = info

[cron.update_checker]
; Aucun appel sortant vers forgejo.org pour savoir s'il existe une version
; plus récente : la version est ÉPINGLÉE et sa mise à jour est une décision,
; pas une notification.
ENABLED = false

[actions]
; Pas de CI ici. Ce conteneur ne fait qu'une chose : servir les dépôts quand
; le cluster est absent.
ENABLED = false
