# pg_ident.conf — correspondances utilisateur système → rôle SQL.
#
# Une seule entrée, et elle porte tout l'accès de Forgejo à sa base.
#
# En authentification « peer », PostgreSQL demande au noyau l'identité du
# processus qui se connecte par la socket Unix. Forgejo tourne sous
# l'utilisateur système « git » (voir forgejo.service) mais doit se connecter
# au rôle SQL « forgejo » (voir app.ini, [database] USER). Sans la ligne
# ci-dessous, peer exige l'égalité des deux noms et refuse :
#
#     FATAL:  Peer authentication failed for user "forgejo"
#
# Renommer l'utilisateur système ou le rôle SQL sans toucher à ce fichier
# casse Forgejo au démarrage suivant, et le message ne désigne pas ce fichier.
#
# MAPNAME     SYSTEM-USERNAME     PG-USERNAME
forgejo       git                 forgejo
